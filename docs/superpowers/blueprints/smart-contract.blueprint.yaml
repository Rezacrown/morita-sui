# All Move functions called via Enoki must be whitelisted in Enoki Portal
# as allowedMoveCallTargets before going live. See design doc Section 4 for full list.
#
# Known limitation: GameItem uses `has key, store` for Sui Kiosk compatibility.
# This prevents enforcing custom transfer rules (e.g., "soulbound" items) at the
# Move level in MVP. Future: `has key` only + custom wrapper for special items.

schemaVersion: 1
name: morita-contracts
description: Sui Move smart contracts for Morita — cross-game inventory & commerce protocol
language: Move
framework: Sui
kind: Sui

events:
  - name: PublisherCreated
    module: registry
    fields:
      - name: publisher_id
        type: "ID"
        indexed: true
      - name: owner
        type: address
        indexed: true
      - name: name
        type: String
        indexed: false

  - name: GameCreated
    module: registry
    description: Emitted by initiate_publish when the Publisher owner creates a new Game (owned, not yet shared).
    fields:
      - name: game_id
        type: "ID"
        indexed: true
      - name: publisher_id
        type: "ID"
        indexed: true
      - name: name
        type: String
        indexed: false

  - name: GameShared
    module: registry
    description: Emitted by finalize_publish when the Game is shared and GameCapability is transferred to the platform.
    fields:
      - name: game_id
        type: "ID"
        indexed: true
      - name: publisher_id
        type: "ID"
        indexed: true
      - name: platform_addr
        type: address
        indexed: true

  - name: GameUpdated
    module: registry
    fields:
      - name: game_id
        type: "ID"
        indexed: true
      - name: new_name
        type: String
        indexed: false

  - name: PublisherVerified
    module: registry
    fields:
      - name: publisher_id
        type: "ID"
        indexed: true

  - name: GamePaused
    module: registry
    fields:
      - name: game_id
        type: "ID"
        indexed: true

  - name: GameResumed
    module: registry
    fields:
      - name: game_id
        type: "ID"
        indexed: true

  - name: ItemMinted
    module: item
    fields:
      - name: item_id
        type: "ID"
        indexed: true
      - name: game_id
        type: "ID"
        indexed: true
      - name: recipient
        type: address
        indexed: true
      - name: blob_id
        type: String
        indexed: false

  - name: ItemBurned
    module: item
    fields:
      - name: item_id
        type: "ID"
        indexed: true
      - name: game_id
        type: "ID"
        indexed: true

  - name: ItemListed
    module: kiosk_ext
    fields:
      - name: item_id
        type: "ID"
        indexed: true
      - name: kiosk_id
        type: "ID"
        indexed: true
      - name: price
        type: u64
        indexed: false
      - name: royalty_bps
        type: "Option<u64>"
        indexed: false

  - name: ItemSold
    module: kiosk_ext
    fields:
      - name: item_id
        type: "ID"
        indexed: true
      - name: seller
        type: address
        indexed: true
      - name: buyer
        type: address
        indexed: true
      - name: price
        type: u64
        indexed: false

  - name: EscrowCreated
    module: escrow
    fields:
      - name: escrow_id
        type: "ID"
        indexed: true
      - name: initiator
        type: address
        indexed: true
      - name: offer_item_id
        type: "ID"
        indexed: true
      - name: counterparty
        type: "Option<address>"
        indexed: false

  - name: EscrowFulfilled
    module: escrow
    fields:
      - name: escrow_id
        type: "ID"
        indexed: true
      - name: fulfiller
        type: address
        indexed: true

  - name: EscrowCancelled
    module: escrow
    fields:
      - name: escrow_id
        type: "ID"
        indexed: true

operations:
  # ═══ registry.move ═══
  - name: createPublisher
    type: mutation
    target: registry.move
    function: "create_publisher(name: String, ctx: &mut TxContext)"
    description: Create a new Publisher on-chain (self-service, anyone can call). Flow B.
    input:
      fields:
        - name: name
          type: String
          required: true
    validations: []
    output:
      fields:
        - name: publisher_id
          type: ID
          required: true
    errors:
      - name: EPUBLISHER_EXISTS
        description: Publisher with this name already exists for this address

  - name: verifyPublisher
    type: mutation
    target: registry.move
    function: "verify_publisher(publisher_id: ID, admin: &AdminCap, ctx: &mut TxContext)"
    description: Admin toggles verification status. Flow A — backend-only.
    input:
      fields:
        - name: publisher_id
          type: ID
          required: true
    validations:
      - step: 1
        name: onlyAdmin
        type: auth
        description: Caller must hold AdminCap
        onFail: E_UNAUTHORIZED
    output:
      fields: []
    errors:
      - name: E_UNAUTHORIZED
        description: Caller does not hold AdminCap

  - name: initiatePublish
    type: mutation
    target: registry.move
    function: "initiate_publish(publisher: &Publisher, name: String, ctx: &mut TxContext)"
    description: Publisher owner creates a new Game (owned, NOT shared yet) + PublishTicket hot potato. Step 1 of 2. Flow B.
    input:
      fields:
        - name: publisher
          type: "&Publisher"
          required: true
        - name: name
          type: String
          required: true
    validations:
      - step: 1
        name: onlyPublisherOwner
        type: auth
        description: Caller must be the Publisher owner
        onFail: E_UNAUTHORIZED
    output:
      fields:
        - name: game
          type: Game
          required: true
          description: Newly created Game (owned, not shared)
        - name: ticket
          type: PublishTicket
          required: true
          description: Hot potato — NO abilities. MUST be consumed by finalize_publish in same PTB.
    errors:
      - name: E_UNAUTHORIZED
        description: Caller is not the publisher owner

  - name: finalizePublish
    type: mutation
    target: registry.move
    function: "finalize_publish(game: &mut Game, ticket: PublishTicket, platform_addr: address, ctx: &mut TxContext)"
    description: Consumes PublishTicket. Creates GameCapability → transfers to platform_addr. Shares Game. Step 2 of 2. Flow B.
    input:
      fields:
        - name: game
          type: "&mut Game"
          required: true
        - name: ticket
          type: PublishTicket
          required: true
        - name: platform_addr
          type: address
          required: true
    validations:
      - step: 1
        name: ticketMatchesGame
        type: business
        description: PublishTicket.game_id must match Game.id
        onFail: E_TICKET_MISMATCH
    output:
      fields:
        - name: game_capability
          type: GameCapability
          required: true
    errors:
      - name: E_TICKET_MISMATCH
        description: PublishTicket does not correspond to this Game

  - name: updateGame
    type: mutation
    target: registry.move
    function: "update_game(game: &mut Game, new_name: String, ctx: &mut TxContext)"
    description: Update game metadata. Game must be active (shared object). Flow A — platform calls.
    input:
      fields:
        - name: game
          type: "&mut Game"
          required: true
        - name: new_name
          type: String
          required: true
    validations:
      - step: 1
        name: gameIsActive
        type: state
        description: Game must not be paused
        onFail: E_GAME_PAUSED
    output:
      fields: []
    errors:
      - name: E_GAME_PAUSED
        description: Game is paused

  - name: pauseGame
    type: mutation
    target: registry.move
    function: "pause_game(game: &mut Game, admin: &AdminCap, ctx: &mut TxContext)"
    description: Admin pauses a game. Flow A.
    input:
      fields:
        - name: game
          type: "&mut Game"
          required: true
    validations:
      - step: 1
        name: onlyAdmin
        type: auth
        description: Caller must hold AdminCap
        onFail: E_UNAUTHORIZED
    output:
      fields: []
    errors:
      - name: E_UNAUTHORIZED
        description: Missing AdminCap

  - name: resumeGame
    type: mutation
    target: registry.move
    function: "resume_game(game: &mut Game, admin: &AdminCap, ctx: &mut TxContext)"
    description: Admin resumes a paused game. Flow A.
    input:
      fields:
        - name: game
          type: "&mut Game"
          required: true
    validations:
      - step: 1
        name: onlyAdmin
        type: auth
        description: Caller must hold AdminCap
        onFail: E_UNAUTHORIZED
    output:
      fields: []
    errors:
      - name: E_UNAUTHORIZED
        description: Missing AdminCap

  # ═══ item.move ═══
  - name: mintItem
    type: mutation
    target: item.move
    function: "mint(game: &mut Game, cap: &GameCapability, item_id: u64, item_type: String, rarity: String, blob_id: String, supply: Option<u64>, recipient: address, ctx: &mut TxContext)"
    description: Mint a GameItem to a recipient. On-chain double-mint prevention via game.minted_items. Flow A.
    input:
      fields:
        - name: game
          type: "&mut Game"
          required: true
          description: Shared Game object for minted_items tracking
        - name: item_id
          type: u64
          required: true
        - name: item_type
          type: String
          required: true
        - name: rarity
          type: String
          required: true
        - name: blob_id
          type: String
          required: true
        - name: supply
          type: "Option<u64>"
          required: true
        - name: recipient
          type: address
          required: true
    validations:
      - step: 1
        name: hasGameCapability
        type: auth
        description: Caller must hold GameCapability for the item's game
        onFail: E_UNAUTHORIZED
      - step: 2
        name: itemNotMinted
        type: state
        description: game.minted_items.contains(item_id) must be false (on-chain trustless check)
        onFail: E_ITEM_EXISTS
    output:
      fields:
        - name: game_item
          type: GameItem
          required: true
    errors:
      - name: E_UNAUTHORIZED
        description: Missing GameCapability
      - name: E_ITEM_EXISTS
        description: Item with this item_id already minted (NFT duplicate prevention)

  - name: burnItem
    type: mutation
    target: item.move
    function: "burn(item: GameItem, game: &mut Game, cap: &GameCapability, ctx: &mut TxContext)"
    description: Destroy a GameItem, remove from game.minted_items. Flow A.
    input:
      fields:
        - name: item
          type: GameItem
          required: true
        - name: game
          type: "&mut Game"
          required: true
    validations:
      - step: 1
        name: hasGameCapability
        type: auth
        description: GameCapability must match the item's game_id
        onFail: E_UNAUTHORIZED
      - step: 2
        name: itemBelongsToGame
        type: business
        description: item.game_id must match game.id
        onFail: E_ITEM_GAME_MISMATCH
    output:
      fields: []
    errors:
      - name: E_UNAUTHORIZED
        description: GameCapability mismatch
      - name: E_ITEM_GAME_MISMATCH
        description: Item does not belong to this Game

  # ═══ kiosk_ext.move ═══
  - name: listForSale
    type: mutation
    target: kiosk_ext.move
    function: "list_for_sale(item: GameItem, kiosk: &mut Kiosk, kiosk_owner_cap: &KioskOwnerCapability, price: Coin<SUI>, royalty_bps: Option<u64>, ctx: &mut TxContext)"
    description: List a GameItem for sale in seller's Kiosk with optional royalty. Flow B.
    input:
      fields:
        - name: item
          type: GameItem
          required: true
        - name: kiosk
          type: "&mut Kiosk"
          required: true
        - name: kiosk_owner_cap
          type: "&KioskOwnerCapability"
          required: true
        - name: price
          type: "Coin<SUI>"
          required: true
        - name: royalty_bps
          type: "Option<u64>"
          required: false
    validations:
      - step: 1
        name: ownsItem
        type: auth
        description: Caller must own the item (Sui object ownership)
        onFail: E_UNAUTHORIZED
      - step: 2
        name: ownsKiosk
        type: auth
        description: kiosk_owner_cap must match kiosk (kiosk::place enforces)
        onFail: E_UNAUTHORIZED
      - step: 3
        name: validRoyalty
        type: input
        description: If provided, royalty_bps 0-10000
        onFail: E_INVALID_ROYALTY
    output:
      fields: []
    errors:
      - name: E_UNAUTHORIZED
        description: Item not owned or cap mismatch
      - name: E_INVALID_ROYALTY
        description: Royalty out of range

  - name: buyItem
    type: mutation
    target: kiosk_ext.move
    function: "buy_item(kiosk: &mut Kiosk, item_id: ID, payment: Coin<SUI>, ctx: &mut TxContext)"
    description: Purchase item from Kiosk. Buyer does NOT need KioskOwnerCapability. Flow B.
    input:
      fields:
        - name: kiosk
          type: "&mut Kiosk"
          required: true
        - name: item_id
          type: ID
          required: true
        - name: payment
          type: "Coin<SUI>"
          required: true
    validations:
      - step: 1
        name: itemListed
        type: state
        description: Item must be listed in Kiosk
        onFail: E_NOT_LISTED
      - step: 2
        name: correctPrice
        type: business
        description: Payment must match listing price
        onFail: E_PRICE_MISMATCH
    output:
      fields:
        - name: item
          type: GameItem
          required: true
    errors:
      - name: E_NOT_LISTED
        description: Item not found in Kiosk
      - name: E_PRICE_MISMATCH
        description: Payment does not match listed price

  # ═══ escrow.move ═══
  - name: lockItemForAny
    type: mutation
    target: escrow.move
    function: "lock_item_for_any(item: GameItem, conditions: EscrowConditions, ctx: &mut TxContext)"
    description: Lock an item in escrow for public barter. Flow B.
    input:
      fields:
        - name: item
          type: GameItem
          required: true
        - name: conditions
          type: EscrowConditions
          required: true
    validations:
      - step: 1
        name: ownsItem
        type: auth
        description: Caller must own the item
        onFail: E_UNAUTHORIZED
    output:
      fields:
        - name: escrow
          type: Escrow
          required: true
    errors:
      - name: E_UNAUTHORIZED
        description: Item not owned by caller

  - name: lockItemForTarget
    type: mutation
    target: escrow.move
    function: "lock_item_for_target(item: GameItem, conditions: EscrowConditions, counterparty: address, ctx: &mut TxContext)"
    description: Lock an item for direct barter to counterparty. Flow B.
    input:
      fields:
        - name: item
          type: GameItem
          required: true
        - name: conditions
          type: EscrowConditions
          required: true
        - name: counterparty
          type: address
          required: true
    validations:
      - step: 1
        name: ownsItem
        type: auth
        description: Caller must own the item
        onFail: E_UNAUTHORIZED
    output:
      fields:
        - name: escrow
          type: Escrow
          required: true
    errors:
      - name: E_UNAUTHORIZED
        description: Item not owned by caller

  - name: fulfillEscrow
    type: mutation
    target: escrow.move
    function: "fulfill_escrow(escrow: &mut Escrow, my_item: GameItem, ctx: &mut TxContext)"
    description: Fulfill escrow with instant 1:1 swap. Flow B.
    input:
      fields:
        - name: escrow
          type: "&mut Escrow"
          required: true
        - name: my_item
          type: GameItem
          required: true
    validations:
      - step: 1
        name: escrowActive
        type: state
        description: Escrow must be active
        onFail: E_ESCROW_INACTIVE
      - step: 2
        name: ownsItem
        type: auth
        description: Caller must own my_item
        onFail: E_UNAUTHORIZED
      - step: 3
        name: matchesConditions
        type: business
        description: my_item must match escrow conditions
        onFail: E_CONDITION_MISMATCH
      - step: 4
        name: notSelf
        type: business
        description: Fulfiller cannot be the initiator
        onFail: E_SELF_FULFILL
      - step: 5
        name: counterpartyCheck
        type: business
        description: If targeted, fulfiller must be the counterparty
        onFail: E_NOT_COUNTERPARTY
    output:
      fields:
        - name: received_item
          type: GameItem
          required: true
    errors:
      - name: E_ESCROW_INACTIVE
        description: Escrow already fulfilled or cancelled
      - name: E_UNAUTHORIZED
        description: Item not owned by caller
      - name: E_CONDITION_MISMATCH
        description: Item does not match escrow conditions
      - name: E_SELF_FULFILL
        description: Cannot fulfill own escrow
      - name: E_NOT_COUNTERPARTY
        description: Escrow is targeted but caller is not the counterparty

  - name: fulfillEscrowWithValue
    type: mutation
    target: escrow.move
    function: "fulfill_escrow_with_value(escrow: &mut Escrow, my_item: GameItem, token_topup: Coin<SUI>, ctx: &mut TxContext)"
    description: Fulfill escrow with SUI top-up for value gap. Flow B.
    input:
      fields:
        - name: escrow
          type: "&mut Escrow"
          required: true
        - name: my_item
          type: GameItem
          required: true
        - name: token_topup
          type: "Coin<SUI>"
          required: true
    validations:
      - step: 1
        name: escrowActive
        type: state
        description: Escrow must be active
        onFail: E_ESCROW_INACTIVE
      - step: 2
        name: ownsItem
        type: auth
        description: Caller must own my_item
        onFail: E_UNAUTHORIZED
      - step: 3
        name: matchesConditions
        type: business
        description: my_item must match escrow conditions
        onFail: E_CONDITION_MISMATCH
      - step: 4
        name: notSelf
        type: business
        description: Fulfiller cannot be initiator
        onFail: E_SELF_FULFILL
      - step: 5
        name: counterpartyCheck
        type: business
        description: If targeted, fulfiller must be counterparty
        onFail: E_NOT_COUNTERPARTY
    output:
      fields:
        - name: received_item
          type: GameItem
          required: true
    errors:
      - name: E_ESCROW_INACTIVE
        description: Escrow already fulfilled or cancelled
      - name: E_UNAUTHORIZED
        description: Item not owned
      - name: E_CONDITION_MISMATCH
        description: Item does not match escrow conditions
      - name: E_SELF_FULFILL
        description: Cannot fulfill own escrow
      - name: E_NOT_COUNTERPARTY
        description: Escrow is targeted but caller is not the counterparty

  - name: cancelEscrow
    type: mutation
    target: escrow.move
    function: "cancel_escrow(escrow: &mut Escrow, ctx: &mut TxContext)"
    description: Cancel own escrow, return item to initiator. Flow B.
    input:
      fields:
        - name: escrow
          type: "&mut Escrow"
          required: true
    validations:
      - step: 1
        name: isInitiator
        type: auth
        description: Only the initiator can cancel
        onFail: E_UNAUTHORIZED
      - step: 2
        name: escrowActive
        type: state
        description: Escrow must be active
        onFail: E_ESCROW_INACTIVE
    output:
      fields:
        - name: returned_item
          type: GameItem
          required: true
    errors:
      - name: E_UNAUTHORIZED
        description: Not the escrow initiator
      - name: E_ESCROW_INACTIVE
        description: Escrow already fulfilled or cancelled
